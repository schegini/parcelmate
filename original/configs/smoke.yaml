# Tiny end-to-end sanity run for the original code. Mirrors the fork's
# `parcelmate/configs/bare.yaml`. Cheap enough to run on a laptop CPU; the
# numbers mean nothing, it just proves the original imports, loads data, and
# writes outputs.
output_dir: results/smoke

connectivity:
  model_name: gpt2
  # Two domains minimum: subnetwork_extraction looks for subnetworks SHARED
  # across domains and indexes domains[0]/domains[1], so a single-domain config
  # dies with a KeyError. Both of these are generated locally -- no downloads.
  domains: [whitespace, random]
  seq_len: 128
  batch_size: 2
  n_samples: 1
  n_tokens: 256

parcellation:
  n_networks: 5
  n_samples: 3
  connectivity_pca_components: 10

subnetwork_extraction: {}
