# Small, fully-offline smoke test for the Project 3 knockout controls.
# Datasets `whitespace` and `random` are synthetic (no download); only the
# gpt2 weights need to be available.
#
#   python -m parcelmate.bin.main parcelmate/configs/knockout.yaml \
#       -s connectivity parcellation subnetwork_extraction subnetwork_knockout
output_dir: results_knockout_test

connectivity:
  model_name: gpt2
  domains: [whitespace, random]
  seq_len: 64
  batch_size: 2
  n_samples: 1
  n_tokens: 256

parcellation:
  n_networks: 4
  n_samples: 3
  connectivity_pca_components: 10

subnetwork_extraction: {}

knockout:
  # Run both modes against the SAME parcellation so mean-out vs zero-out is a
  # valid comparison (identical neurons per network). A single string still works.
  knockout_mode: [mean, zero]   # 'mean' (clamp to a mean activation) and/or 'zero'
  # mean_domain: wikitext  # clamp mean-out to one corpus's mean instead of the
                           # cross-domain aggregate (must be one of `domains`
                           # above); lets you clamp to wiki and watch how the
                           # model then processes the other corpora. Default:
                           # null -> cross-domain aggregate.
  n_baseline: 2            # size-matched random controls per condition
  baseline_seed: 0
  networks: [0]            # restrict to first shared network for a fast test
  include_union: false     # union no longer analyzed; per-network only
  include_healthy: true
  eval_loss: true
  loss_n_tokens: 256
  steps: []                # skip per-condition stability plots in the smoke test
