# Iteration 2 base config: Project-3 selectivity, gpt2, tuning the knockout
# threshold. Tests the first 5 subnetworks (not just 3) for a population view of
# selectivity. Both knockout modes and both thresholds run IN-RUN against the
# single parcellation of the healthy model, so mode and threshold comparisons
# are like-for-like; neither belongs in the sweep grid.
output_dir: /nlp/scr/schegini/parcelmate/knockout_iter2

connectivity:
  model_name: gpt2
  domains: [wikitext, tldr17, codeparrot, random]
  seq_len: 512
  n_samples: 2
  n_tokens: 50000
  # 4, not 8: the lm_head logits are batch x seq_len x 50257 floats (~786 MiB at
  # batch 8), the largest allocation in the pass and the one that OOMs when the
  # GPU is shared with another job. Only changes how the token budget is chunked
  # -- n_tokens is set explicitly below, so the data seen is identical.
  batch_size: 4

parcellation:
  n_networks: 50
  n_samples: 10
  connectivity_pca_components: 200

subnetwork_extraction: {}

knockout:
  knockout_mode: [mean, zero]   # both modes share ONE parcellation per job
  knockout_thresh: [0.5, 0.9]   # ditto: both thresholds, one parcellation
  n_baseline: 3
  baseline_seed: 0
  networks: [0, 1, 2, 3, 4]
  include_union: false
  include_healthy: true
  eval_loss: true
  loss_n_tokens: 50000
  steps: [plot_stability]
